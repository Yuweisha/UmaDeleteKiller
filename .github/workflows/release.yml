name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Show artifact
        shell: pwsh
        run: |
          $f = "target/release/assetcleanupguard.dll"
          if (Test-Path $f) {
            Get-Item $f | Select-Object Name, Length
          } else {
            Write-Error "assetcleanupguard.dll not produced"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/assetcleanupguard.dll out/
          Compress-Archive -Path out/assetcleanupguard.dll -DestinationPath assetcleanupguard-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assetcleanupguard
          path: |
            out/assetcleanupguard.dll
            assetcleanupguard-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/assetcleanupguard.dll
            assetcleanupguard-windows-x64.zip
          generate_release_notes: false
          body: |
            Drop `assetcleanupguard.dll` into `<game>/hachimi/plugins/` and add
            `assetcleanupguard` to `load_libraries` in `hachimi/config.json`.

            Blocks the game's automatic cleanup of `Persistent/dat/` assets.
